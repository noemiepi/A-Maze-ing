[project]
name = "loading.py"
version = "1.0"
description = "poetry demo"
authors = [
    {name = "frrenaux"}
]
license = {text = "non"}
requires-python = ">=3.10"
dependencies = [
    "pandas (==2.1.0)",
    "matplotlib (==3.7.2)",
    "requests (==2.31.0)",
    "numpy (==1.24.0)"
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
