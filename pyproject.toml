[project]
name = "a_maze_ing"
version = "1.0"
description = "projet a-maze-ing"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic>=2.12.5",
    "mypy>=1.19.1",
    "poetry>=2.3.2",
    "arcade (>=3.3.3,<4.0.0)",
]
authors = [
    {name = "npillet"},
    {name = "frrenaux"}
]
license = "MIT"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.19.1",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
